<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" style="background:#fff" viewBox="0 0 1200 730" role="img" aria-labelledby="orgTitle orgDesc"><title id="orgTitle">Organigrama da AADID</title><desc id="orgDesc">A Assembleia Geral e o Conselho Fiscal estão no topo. A Direção coordena a Unidade Terapêutica, o CACI e o Técnico Administrativo, cada um com as suas equipas.</desc><style>
.org-lines polyline{fill:none;stroke:#B7DFD1;stroke-width:2;stroke-linejoin:round}
.on rect{fill:#E8F5F0;stroke:#B7DFD1;stroke-width:1.5}
.on text{font-family:Poppins,'Avenir Next','Segoe UI',Arial,sans-serif;font-size:15px;font-weight:600;fill:#132219;text-anchor:middle;dominant-baseline:central}
.on--top rect{fill:#1F4425;stroke:#1F4425}.on--top text{fill:#fff;font-size:17px}
.on--dir rect{fill:#0B8A1E;stroke:#0B8A1E}.on--dir text{fill:#fff;font-size:16px}
.on--fiscal rect{fill:#fff;stroke:#1F4425;stroke-width:2}.on--fiscal text{fill:#1F4425}
.on--resp rect{fill:#F4DE1A;stroke:#D8C200}.on--resp text{fill:#1F4425;font-size:16px}
